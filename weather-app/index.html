<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="weather-app">

  <!--blurr button-->
  <button id="openModal" class="location-btn">Change Location</button>

  <!--Weather con-->
  <section class="current">
    <div class="temp" id="temp">Loading...</div>
    <div class="condition" id="condition">Loading...</div>
    <img id="weatherIcon" src="" alt="weather icon">

    <div class="details">
      <div class="detail">
        <span class="label">Wind</span>
        <span id="wind">--</span>
      </div>
      <div class="detail">
        <span class="label">Humidity</span>
        <span id="humidity">--</span>
      </div>
    </div>
  </section>

  <!--Forecast-->
  <section class="forecast">

    <div class="day">
      <h3 id="day1-name">Today</h3>
      <p id="day1-temp">--</p>
      <p id="day1-cond">--</p>
      <p id="day1-wind">--</p>
    </div>

    <div class="day">
      <h3 id="day2-name">Tomorrow</h3>
      <p id="day2-temp">--</p>
      <p id="day2-cond">--</p>
      <p id="day2-wind">--</p>
    </div>

    <div class="day">
      <h3 id="day3-name">Next Day</h3>
      <p id="day3-temp">--</p>
      <p id="day3-cond">--</p>
      <p id="day3-wind">--</p>
    </div>

  </section>

</main>

<!--Modal shmodal-->
<div id="modal" class="hidden">
  <div class="modal-content">
    <form id="locationForm">
      <input type="text" id="locationInput" placeholder="Enter city or zip" required>
      <button type="submit">Search</button>
    </form>
  </div>
</div>
<!--Dont forget the s-->
<script src="scripts.js"></script>

</body>
</html>
