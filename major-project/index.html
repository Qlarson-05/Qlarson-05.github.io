<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibe Recommender</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <h1>How ya feelin?</h1>

  <div class="top-section">

    <!-- moods -->
    <div class="moods">
      <button onclick="setMood('happy')">😊 Happy</button>
      <button onclick="setMood('sad')">😢 Sad</button>
      <button onclick="setMood('stressed')">😵 Stressed</button>
      <button onclick="setMood('bored')">😐 Bored</button>
    </div>

    <!-- category -->
    <div class="categories">
      <button>🎬 Movies</button>
      <button>🎧 Music</button>
      <button>🎲 Activities</button>
    </div>

  </div>

  <!-- main -->
  <div class="main">

    <!-- info -->
    <div class="box info" id="info">
      Additional Info
    </div>

    <!-- song (maybe) -->
    <div class="box" id="song">
      Song
    </div>

    <!-- movies -->
    <div class="box movie-box">
      <h3>Movies</h3>
      <div id="movie-grid"></div>
    </div>

    <!-- activity -->
    <div class="box" id="activity">
      Activity
    </div>

    <!-- you got this! -->
    <div class="box affirmation" id="affirmation">
      Affirmation
    </div>

  </div>

  <!-- dark mode toggle -->
  <div class="toggle">
    <label>Dark mode</label>
    <input type="checkbox" id="darkToggle">
  </div>

  <script src="script.js"></script>

</body>
</html>
