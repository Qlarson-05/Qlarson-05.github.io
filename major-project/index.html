<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibe Recommender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>How ya feelin?</h1>

<div class="top-section">
  <div class="moods">
    <button>😊 Happy</button>
    <button>😢 Sad</button>
    <button>😵 Stressed</button>
    <button>😐 Bored</button>
  </div>

  <div class="categories">
    <button>🎬 Movies</button>
    <button>🎧 Music</button>
    <button>🎲 Activities</button>
  </div>
</div>

<div class="main">
  <div class="box info">Additional Info</div>

  <div class="box">Song</div>
  <div class="box">Movie</div>
  <div class="box">Activity</div>

  <div class="box affirmation">Affirmation</div>
</div>

  <div id="results">
    <!-- Note: I want results here -->
  </div>

  <div class="toggle">
    <label>Dark mode</label>
    <input type="checkbox">
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
