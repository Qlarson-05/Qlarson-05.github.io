<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Project 6 – Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="weather-app">

  <!-- Current Weather for aberdeen -->
  <section class="current">
    <div class="temp">Aberdeen, WA ~ 52°F</div>
    <div class="condition">Cloudy ☁️</div>

    <div class="details">
      <div class="detail">
        <span class="label">Wind</span>
        <span>3 mph, SW</span>
      </div>
      <div class="detail">
        <span class="label">Humidity</span>
        <span>91% (yikes)</span>
      </div>
    </div>
  </section>

  <!-- Forecast for tmr (2/11/2026) -->
  <section class="forecast">
    <div class="day">
      <h3>Tomorrow</h3>
      <p>49° / 38°</p>
      <p>cloudy (again :( ☁️)</p>
      <p>6 mph, SW</p>
    </div>

    <div class="day">
      <h3>Friday</h3>
      <p>47° / 36°</p>
      <p>light rain 🌧️</p>
      <p>9 mph, NW</p>
    </div>

    <div class="day">
      <h3>Saturday (Valentines Day 💕) </h3>
      <p>48° / 32°</p>
      <p> cloudy! when isnt aberdeen grey tho? ☁️</p>
      <p>10 mph, NE</p>
    </div>
  </section>

</main>

</body>
</html>
