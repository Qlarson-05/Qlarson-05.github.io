<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Project 6 – Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="weather-app">

  <!-- Current Weather for aberdeen -->
  <section class="current">
    <div class="temp">40°F</div>
    <div class="condition">Cloudy ☁️</div>

    <div class="details">
      <div class="detail">
        <span class="label">Wind</span>
        <span>3 mph</span>
      </div>
      <div class="detail">
        <span class="label">Humidity</span>
        <span>91% (yikes)</span>
      </div>
    </div>
  </section>

  <!-- Forecast for tmr (2/11/2026) -->
  <section class="forecast">
    <div class="day">
      <h3>Tomorrow</h3>
      <p>49° / 38°</p>
      <p>cloudy (again :( ☁️)</p>
      <p>6 mph</p>
    </div>

    <div class="day">
      <h3>Day 2</h3>
      <p>74° / 60°</p>
      <p>Cloudy ☁️</p>
      <p>8 mph</p>
    </div>

    <div class="day">
      <h3>Day 3</h3>
      <p>70° / 58°</p>
      <p>Rain 🌧️</p>
      <p>10 mph</p>
    </div>
  </section>

</main>

</body>
</html>
